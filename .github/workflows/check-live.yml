name: check-live

# Checks that https://selotape.dev/resume serves this repo's page and that the
# resume's links work: a few minutes after each push to main (Cloudflare
# Workers Builds deploys it), and once a day, so a broken site or link shows up
# as a failed run (GitHub emails it).
# Lets an agent confirm a deploy without reaching the site itself.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the page and the PDF
        run: |
          for i in $(seq 1 20); do
            page=$(curl -sS -L --max-time 15 https://selotape.dev/resume || true)
            pdf=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' --max-time 15 https://selotape.dev/resume.pdf || true)
            if grep -q 'class="dl"' <<<"$page" && [[ $pdf == "200 application/pdf"* ]]; then
              echo "Live: page and PDF OK"; exit 0
            fi
            echo "Not yet (pdf: $pdf); retrying in 20s"
            sleep 20
          done
          echo "::error::selotape.dev/resume is not serving the resume page"
          echo "$page" | head -c 2000
          curl -sSI --max-time 15 https://selotape.dev/resume || true
          exit 1
      - name: Links in the resume work
        if: always()
        run: |
          fail=0
          for url in $(grep -o '<a [^>]*href="https\?://[^"]*"' public/resume.html | sed 's/.*href="//; s/"$//' | sort -u); do
            code=$(curl -s -o /dev/null -L --max-time 20 -A 'Mozilla/5.0' -w '%{http_code}' "$url")
            echo "$code $url"
            # LinkedIn answers bots with 999 even for a real profile.
            [[ $code == 2* || ($code == 999 && $url == *linkedin.com*) ]] || fail=1
          done
          exit $fail
